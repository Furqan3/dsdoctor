# The test suite is offline: no GPU, no network, no model endpoint, and no
# evaluation corpus. `data/` is generated rather than committed, so the twelve
# cases in test_measured_configuration.py skip here and run locally after
# `eval/build_corpus.py`. Everything else runs from synthetic fixtures.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        # 3.12 is declared supported in pyproject but has not been run against
        # this suite yet, so it reports without gating the badge. Move it into
        # the list above once a run has come back green.
        include:
          - python-version: "3.12"
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run the suite
        run: pytest -q

      - name: The detectors must never import a language model
        # The project's central claim, checked rather than asserted: no
        # detector may generate a finding with a model. See README, "The three
        # design decisions that matter".
        run: |
          if grep -rniE "openai|anthropic|litellm|transformers" src/dsdoctor/detectors/ ; then
            echo "::error::a detector imports a language model client"
            exit 1
          fi
          echo "clean: no model client referenced under src/dsdoctor/detectors/"
