# Gate a dataset the way you would gate code.
#
# The deterministic half of dsdoctor needs no GPU, no model endpoint and no
# network, and runs a 600-image dataset in a couple of seconds - so there is no
# reason for a train/val leak to reach a training run rather than a pull
# request. Findings are uploaded as SARIF, which GitHub renders as annotations
# against the offending label files.

name: dataset check

on:
  pull_request:
    paths: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write        # required to upload SARIF

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dsdoctor
        run: pip install -e .

      - name: Locate the dataset
        id: find
        # This repository's own `data/` is generated, not committed, so the
        # template would otherwise go red the first time anyone pressed "Run
        # workflow" - a failing check on a repository that is not failing.
        # Point DATASET at your data and the steps below become live.
        run: |
          DATASET="data/my_dataset"
          if [ -d "$DATASET" ]; then
            echo "found=true"   >> "$GITHUB_OUTPUT"
          else
            echo "found=false"  >> "$GITHUB_OUTPUT"
            echo "::notice::no dataset at $DATASET - this workflow is a "\
                 "template; set DATASET to a committed dataset to enable it."
          fi
          echo "path=$DATASET"  >> "$GITHUB_OUTPUT"

      - name: Scan the dataset
        id: scan
        if: steps.find.outputs.found == 'true' 
        # --fail-on critical blocks the merge on anything that would stop the
        # run or invalidate the metrics. Governance findings never fail the
        # gate; they are reported and read by a person.
        run: |
          dsdoctor scan data/my_dataset \
            --checks all \
            --format sarif > dsdoctor.sarif
          dsdoctor scan data/my_dataset --checks all --fail-on critical

      - name: Upload findings
        if: always() && steps.find.outputs.found == 'true' 
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dsdoctor.sarif
          category: dsdoctor

      - name: Attach the health card
        if: always() && steps.find.outputs.found == 'true'
        run: dsdoctor card "${{ steps.find.outputs.path }}" --checks all --out card_out

      - uses: actions/upload-artifact@v4
        if: always() && steps.find.outputs.found == 'true' 
        with:
          name: dataset-health-card
          path: card_out/
